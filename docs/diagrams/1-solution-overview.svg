<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" role="img" aria-labelledby="t d">
<title id="t">YuktAI solution overview</title><desc id="d">Four entry points lead to the CLI, the library and the PyPI package. The CLI creates a Next.js app with an optional Python API. The library uses three Rust engines. ask-page is a separate package. The docs and demo sites use the library.</desc>
