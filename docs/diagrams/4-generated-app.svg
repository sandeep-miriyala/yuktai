<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Modules inside a generated YuktAI app</title><desc id="d">The Next.js site has seven pages. The Python backend has seven modules, including three agents. Below are the Rust crate, the tests and optional PostgreSQL.</desc>
