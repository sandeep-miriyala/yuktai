# PostgreSQL 17 with pgvector, on your computer:
#   docker compose -f backend/db/docker-compose.yml up -d
# Then DATABASE_URL=postgresql://postgres:postgres@localhost:5432/yuktai
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local only: change it for anything online
      POSTGRES_DB: yuktai
    ports:
      - "5432:5432"
    volumes:
      - yuktai-db:/var/lib/postgresql/data
volumes:
  yuktai-db:
