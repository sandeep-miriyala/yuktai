[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yuktai"
version = "0.2.0"
description = "YuktAI for Python web apps: accessibility, page tools and data grid for Django, Flask, FastAPI and Streamlit in one line, and Setu: publish a Streamlit app with no server, offline and installable. Runs in the browser, no API keys."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Sandeep Miriyala" }]
keywords = ["accessibility", "wcag", "a11y", "django", "flask", "fastapi", "streamlit", "stlite", "pwa", "offline", "telugu", "indic", "data-grid", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Flask",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Natural Language :: Telugu",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
setu = ["streamlit>=1.51"]
test = ["pytest>=8", "jinja2>=3.1", "django>=4.2"]

[project.scripts]
yuktai-setu = "yuktai.cli:setu_main"

[project.urls]
Documentation = "https://sandeep-miriyala.github.io/yuktai/"
Source = "https://github.com/sandeep-miriyala/yuktai"
Issues = "https://github.com/sandeep-miriyala/yuktai/issues"
npm = "https://www.npmjs.com/package/@yuktishaalaa/yuktai"

[tool.hatch.build.targets.wheel]
packages = ["src/yuktai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
