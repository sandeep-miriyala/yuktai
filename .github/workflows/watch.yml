# YuktAI watch: every 3 hours, checks all your websites, GitHub repos (CI,
# issues, stars) and npm, crates.io and PyPI packages.
#
#   The full report (all tables) goes into one issue, "YuktAI watch report".
#   When something changes (a site goes down, CI fails, it is fixed, a new star or
#   version), a new comment @mentions you and GitHub emails you the whole report.
#   Nothing changed → no comment, no email.
#
# Setup (once):
#   1. GitHub → your profile → Settings → Notifications → "Participating, @mentions
#      and custom": Email on (it is on by default).
#   2. Private repos too: GitHub → Settings → Developer settings → Fine-grained tokens →
#      Generate. Repository access: all (or the ones to watch). Permissions, all
#      Read-only: Actions, Contents, Issues, Pull requests. Save it in this repo's
#      Settings → Secrets and variables → Actions as WATCH_TOKEN. Skip for public repos only.
#   3. Your repos and websites (optional): this repo → Settings → Secrets and variables →
#      Actions → Variables tab → New repository variable:
#        WATCH_REPOS  one owner/repo per line   (empty: every repo of yours)
#        WATCH_SITES  one https:// address per line
#      Kept there, the lists are not in this public file.
#   4. Actions tab → "YuktAI watch" → Run workflow, to try it now.
#
# Every 3 hours from 05:30 IST. GitHub may start a scheduled run a few minutes late.
# In a public repo, private repo names are hidden on the Summary page.

name: YuktAI watch

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours: 05:30, 08:30, 11:30 … 02:30 IST
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: yuktai-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/watch.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # remembers the last run, so the message can say what changed
      - name: Last run
        uses: actions/cache/restore@v4
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: Check and write the report issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCH_TOKEN: ${{ secrets.WATCH_TOKEN }}
          WATCH_REPO_PRIVATE: ${{ github.event.repository.private }}
          # Your lists live in Settings → Secrets and variables → Actions → Variables,
          # not in this public file. One per line. WATCH_REPOS empty = every repo of the
          # owner (private ones too when WATCH_TOKEN is set).
          WATCH_REPOS: ${{ vars.WATCH_REPOS }}
          WATCH_SITES: ${{ vars.WATCH_SITES }}
          WATCH_STATE: .watch-state.json
        run: node scripts/watch.mjs

      - name: Save this run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
