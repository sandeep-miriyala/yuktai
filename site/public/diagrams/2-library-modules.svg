<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 426" width="680" height="426" role="img" aria-labelledby="t d">
<title id="t">YuktAI library modules</title><desc id="d">The library has 12 modules in three rows. Below it are three Rust engines and the one-file vanilla CDN build.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.bg{fill:#ffffff}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#ffffff;stroke:#B4B2A9;stroke-width:.75}
.arr{stroke:#888780;stroke-width:1.5;fill:none;marker-end:url(#a)}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.75}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.75}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.75}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.th,.t{fill:#F1EFE8}.ts{fill:#B4B2A9}.box{fill:#1b1f27;stroke:#5F5E5A}
.c-purple>rect{fill:#26215C;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect{fill:#04342C;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}
.c-gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.c-gray>.th{fill:#F1EFE8}.c-gray>.ts{fill:#B4B2A9}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="426" rx="12"/>
<g class="c-purple container"><rect x="30" y="20" width="620" height="276" rx="20"/><text class="th" x="340" y="46">Library: @yuktishaalaa/yuktai</text></g>
<g><rect class="box" x="50" y="72" width="130" height="56" rx="8"/><text class="th" x="115" y="91">Data grid</text><text class="ts" x="115" y="110">Search, sort</text></g>
<g><rect class="box" x="200" y="72" width="130" height="56" rx="8"/><text class="th" x="265" y="91">Grid assistant</text><text class="ts" x="265" y="110">Talk to data</text></g>
<g><rect class="box" x="350" y="72" width="130" height="56" rx="8"/><text class="th" x="415" y="91">WebMCP</text><text class="ts" x="415" y="110">Tools for agents</text></g>
<g><rect class="box" x="500" y="72" width="130" height="56" rx="8"/><text class="th" x="565" y="91">Accessibility</text><text class="ts" x="565" y="110">WCAG 2.2 fixes</text></g>
<g><rect class="box" x="50" y="146" width="130" height="56" rx="8"/><text class="th" x="115" y="165">Page tools</text><text class="ts" x="115" y="184">QA, forms, design</text></g>
<g><rect class="box" x="200" y="146" width="130" height="56" rx="8"/><text class="th" x="265" y="165">Built-in AI</text><text class="ts" x="265" y="184">RAG, summarise</text></g>
<g><rect class="box" x="350" y="146" width="130" height="56" rx="8"/><text class="th" x="415" y="165">Vibe coder</text><text class="ts" x="415" y="184">Text to Next.js</text></g>
<g><rect class="box" x="500" y="146" width="130" height="56" rx="8"/><text class="th" x="565" y="165">Wrapper</text><text class="ts" x="565" y="184">Floating buttons</text></g>
<g><rect class="box" x="50" y="220" width="130" height="56" rx="8"/><text class="th" x="115" y="239">Experience</text><text class="ts" x="115" y="258">Splash, languages</text></g>
<g><rect class="box" x="200" y="220" width="130" height="56" rx="8"/><text class="th" x="265" y="239">Icons</text><text class="ts" x="265" y="258">163 icons</text></g>
<g><rect class="box" x="350" y="220" width="130" height="56" rx="8"/><text class="th" x="415" y="239">Plugins</text><text class="ts" x="415" y="258">WCAG, voice, AI</text></g>
<g><rect class="box" x="500" y="220" width="130" height="56" rx="8"/><text class="th" x="565" y="239">Runtime</text><text class="ts" x="565" y="258">Engine loader</text></g>
<line x1="115" y1="296" x2="115" y2="328" class="arr"/><line x1="265" y1="296" x2="265" y2="328" class="arr"/><line x1="415" y1="296" x2="415" y2="328" class="arr"/><line x1="565" y1="296" x2="565" y2="328" class="arr"/>
<g class="c-teal"><rect x="50" y="330" width="130" height="56" rx="8"/><text class="th" x="115" y="349">grid-core</text><text class="ts" x="115" y="368">Rust: grid</text></g>
<g class="c-teal"><rect x="200" y="330" width="130" height="56" rx="8"/><text class="th" x="265" y="349">rag-core</text><text class="ts" x="265" y="368">Rust: page search</text></g>
<g class="c-teal"><rect x="350" y="330" width="130" height="56" rx="8"/><text class="th" x="415" y="349">ask-core</text><text class="ts" x="415" y="368">Rust: ask-page</text></g>
<g class="c-teal"><rect x="500" y="330" width="130" height="56" rx="8"/><text class="th" x="565" y="349">Vanilla build</text><text class="ts" x="565" y="368">One-file CDN</text></g>
</svg>
