<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346" width="680" height="346" role="img" aria-labelledby="t d">
<title id="t">What npm run dev does</title><desc id="d">npm run dev builds Rust to WebAssembly, starts the Python API on a free port and starts Next.js. The browser loads the site and the wasm file and calls the API.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.bg{fill:#ffffff}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#ffffff;stroke:#B4B2A9;stroke-width:.75}
.arr{stroke:#888780;stroke-width:1.5;fill:none;marker-end:url(#a)}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.75}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.75}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.75}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.th,.t{fill:#F1EFE8}.ts{fill:#B4B2A9}.box{fill:#1b1f27;stroke:#5F5E5A}
.c-purple>rect{fill:#26215C;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect{fill:#04342C;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}
.c-gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.c-gray>.th{fill:#F1EFE8}.c-gray>.ts{fill:#B4B2A9}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="346" rx="12"/>
<g><rect class="box" x="240" y="40" width="200" height="44" rx="8"/><text class="th" x="340" y="62">npm run dev</text></g>
<path d="M300 84 L300 112 L130 112 L130 138" class="arr"/><line x1="340" y1="84" x2="340" y2="138" class="arr"/><path d="M380 84 L380 112 L550 112 L550 138" class="arr"/>
<g class="c-purple"><rect x="50" y="140" width="160" height="56" rx="8"/><text class="th" x="130" y="159">1. Rust build</text><text class="ts" x="130" y="178">public/wasm/core.wasm</text></g>
<g class="c-purple"><rect x="260" y="140" width="160" height="56" rx="8"/><text class="th" x="340" y="159">2. Python API</text><text class="ts" x="340" y="178">Free port from 8000</text></g>
<g class="c-purple"><rect x="470" y="140" width="160" height="56" rx="8"/><text class="th" x="550" y="159">3. Next.js dev</text><text class="ts" x="550" y="178">localhost:3000</text></g>
<path d="M130 196 L130 278 L238 278" class="arr"/><line x1="340" y1="196" x2="340" y2="248" class="arr"/><path d="M550 196 L550 278 L442 278" class="arr"/>
<g class="c-teal"><rect x="240" y="250" width="200" height="56" rx="8"/><text class="th" x="340" y="269">Browser</text><text class="ts" x="340" y="288">Site, wasm, API calls</text></g>
</svg>
