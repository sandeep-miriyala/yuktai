[package]
name = "yuktai-grid-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "yuktai grid engine in Rust: the grid's existing search and number/date sort, compiled to WebAssembly."
repository = "https://github.com/sandeep-miriyala/yuktai"
homepage = "https://sandeep-miriyala.github.io/yuktai/rust/"
readme = "README.md"
keywords = ["grid", "sort", "search", "wasm", "no-std"]
categories = ["algorithms", "wasm", "no-std"]
authors = ["Sandeep Miriyala"]
rust-version = "1.70"

[lib]
# cdylib = the .wasm file for the browser; rlib = `cargo test` on your machine.
crate-type = ["cdylib", "rlib"]

[dependencies]
# None. The engine uses only Rust's `core` library, so the .wasm stays tiny.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
