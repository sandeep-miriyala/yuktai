[package]
name = "yuktai-rag-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "yuktai page + data RAG in Rust: the existing BM25 passage search with an inverted index, compiled to WebAssembly."
repository = "https://github.com/sandeepmiriyala03/yuktai"
publish = false

[lib]
# cdylib = the .wasm file for the browser; rlib = `cargo test` on your machine.
crate-type = ["cdylib", "rlib"]

[dependencies]
# None. Only Rust's `core` and `alloc` libraries, so the .wasm stays small.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
