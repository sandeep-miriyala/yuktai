:root{--bg:#f6f8fc;--text:#0f1a33;--muted:#46526b;--line:#d8dfeb;--brand:#0038b4;--ink:#fff;color-scheme:light}

body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.6;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.primary{background:var(--brand);color:var(--ink)}
.ghost{border:2px solid var(--line);color:var(--text)}

</style>
</head>
